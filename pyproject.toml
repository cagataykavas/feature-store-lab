[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-store-service"
version = "0.2.0"
description = "Point-in-time correct offline/online feature store reference service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["feature_store"]
packages = ["app", "storage"]

[tool.ruff]
line-length = 100
